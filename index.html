<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FindIT — Campus Lost &amp; Found</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">FindIT</a>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="index.html" aria-current="page">Home</a>
      <a href="app.html">Lost &amp; Found</a>
    </nav>
  </header>
  <main class="container">
    <section class="hero">
      <h1>Find what you lost on campus.</h1>
      <p>Search reported belongings or post a lost or found item in one place.</p>

      <div class="stats">
        <div><span>Lost:</span> <strong id="stat-lost">0</strong></div>
        <div><span>Found:</span> <strong id="stat-found">0</strong></div>
        <div><span>Total:</span> <strong id="stat-total">0</strong></div>
      </div>

      <div class="hero-actions">
        <a class="btn btn-primary" href="app.html">Browse Lost &amp; Found</a>
        <a class="btn btn-ghost" href="app.html#report-section">Report an Item</a>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
